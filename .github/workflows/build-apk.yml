name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME is: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ] || [ ! -d "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set or does not point to a valid directory." >&2
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ] || [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java major version (${JAVA_MAJOR:-unknown}) is lower than 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java ${JAVA_MAJOR} at ${JAVA_HOME}"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated temporary debug.keystore."
          else
            echo "debug.keystore already exists. Skipping creation."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "Found debug APK at expected path: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: Debug APK not found at: $APK_PATH" >&2
            echo "Searching only in app/build/outputs/apk for any generated APKs:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_NAME=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RUNNER_TEMP}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          cat << 'EOF' > release_notes.md
          ## 🚀 FITBUNK Debug APK Build

          - **Build Run**: #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **File**: `${{ steps.prep_asset.outputs.asset_name }}`

          ### 📱 Direct Download & Installation
          - Download the `.apk` file below directly onto your Android device.
          - Open the downloaded APK and approve installation from your browser or file manager if prompted.
          - This build is signed with the standard debug key for testing.
          EOF

          gh release create "$TAG_NAME" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        run: |
          RELEASE_STATUS="${{ steps.create_release.outcome }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "## 📦 Android Build & APK Delivery Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_STATUS" = "success" ]; then
            RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${ASSET_NAME}"
            echo "### ✅ Release Published Successfully!" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release**: [${RELEASE_TITLE}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct APK Download**: [Download ${ASSET_NAME}](${DOWNLOAD_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ GitHub Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub release step completed with outcome: \`${RELEASE_STATUS}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📥 Actions Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK is also preserved as a build artifact in this GitHub Actions run:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact Name**: \`app-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- You can download it directly from the **Artifacts** section at the bottom of the workflow summary page." >> "$GITHUB_STEP_SUMMARY"
